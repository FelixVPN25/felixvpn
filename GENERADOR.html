<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Admin - Generador VIP Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151a27;
            --primary: #00d2ff;
            --success: #00e676;
            --warning: #ff9800;
            --text: #ffffff;
            --code-bg: #080b12;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .admin-container {
            width: 100%;
            max-width: 700px;
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; opacity: 0.8; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); }
        .actions { display: flex; gap: 10px; margin: 20px 0; }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
        }
        .btn-gen { background: var(--primary); color: #0b0f19; }
        .btn-gen:hover { transform: scale(1.02); }
        
        /* Secciones de Salida */
        .output-box {
            margin-top: 20px;
            background: var(--code-bg);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .github-box { border-left: 4px solid var(--primary); }
        .client-box { border-left: 4px solid var(--success); }

        .box-header { 
            color: var(--primary); 
            font-size: 11px; 
            font-weight: 900; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .btn-copy-small {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
            cursor: pointer;
            border: none;
        }
        .btn-copy-small:hover { background: var(--primary); color: #000; }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            padding: 0;
        }
        #rawOutput { color: var(--primary); height: 60px; }
        #clientOutput { color: var(--success); height: 120px; }

        .history-table {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .history-table th { text-align: left; padding: 10px; border-bottom: 2px solid rgba(255,255,255,0.1); color: var(--primary); }
        .history-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="admin-container">
    <h2><i class="fa-solid fa-user-shield"></i> PANEL FELIX PREMIUM</h2>
    
    <div style="display: flex; gap: 15px;">
        <div class="input-group" style="flex: 2;">
            <label>Nombre del Cliente</label>
            <input type="text" id="clientName" placeholder="Nombre completo" autocomplete="off">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>Días</label>
            <input type="number" id="daysAccess" value="30">
        </div>
    </div>

    <button class="btn-gen" onclick="generateToken()">
        <i class="fa-solid fa-plus-circle"></i> GENERAR ACCESO VIP
    </button>

    <div class="output-box github-box">
        <div class="box-header">
            <span><i class="fa-brands fa-github"></i> PEGAR EN GITHUB (PREMIUM.TXT)</span>
            <button class="btn-copy-small" onclick="copyText('rawOutput')">COPIAR</button>
        </div>
        <textarea id="rawOutput" readonly placeholder="Esperando generación..."></textarea>
    </div>

    <div class="output-box client-box">
        <div class="box-header" style="color: var(--success);">
            <span><i class="fa-brands fa-whatsapp"></i> INFO PARA EL CLIENTE (MENSAJE)</span>
            <button class="btn-copy-small" onclick="copyText('clientOutput')">COPIAR MENSAJE</button>
        </div>
        <textarea id="clientOutput" readonly placeholder="Esperando generación..."></textarea>
    </div>

    <table class="history-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>CLIENTE</th>
                <th>VENCE</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script>
    let tokenList = [];

    function generateToken() {
        const nameInput = document.getElementById('clientName');
        const name = nameInput.value.trim() || "CLIENTE";
        const days = parseInt(document.getElementById('daysAccess').value) || 30;
        
        // Generar ID
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let token = "";
        for (let i = 0; i < 8; i++) { token += chars.charAt(Math.floor(Math.random() * chars.length)); }

        // Fecha
        const date = new Date();
        date.setDate(date.getDate() + days);
        const dateStr = date.toISOString().split('T')[0] + " 23:59:59";
        const dateSimple = date.toISOString().split('T')[0];

        const data = {
            id: token,
            expiry: dateStr,
            client: name.toUpperCase(),
            simpleDate: dateSimple
        };

        tokenList.push(data);
        updateUI(data);
        nameInput.value = ""; 
    }

    function updateUI(last) {
        // Actualizar Tabla
        const body = document.getElementById('historyBody');
        body.innerHTML = "";
        tokenList.slice().reverse().forEach(t => {
            body.innerHTML += `<tr>
                <td style="color:var(--success); font-family:monospace; font-weight:bold;">${t.id}</td>
                <td>${t.client}</td>
                <td style="opacity:0.7;">${t.simpleDate}</td>
            </tr>`;
        });

        // Formato GitHub
        document.getElementById('rawOutput').value = `${last.id},${last.expiry},1234,${last.client.toLowerCase()},0`;

        // Formato Cliente
        const msg = `⚡ *FELIX PREMIUM VIP* ⚡\n\n` +
                    `Hola *${last.client}*, tu acceso ha sido activado.\n\n` +
                    `🔑 *TU ID:* ${last.id}\n` +
                    `📅 *VENCE:* ${last.simpleDate}\n` +
                    `🛡️ *ESTADO:* Premium Activo\n\n` +
                    `*Instrucciones:*\n` +
                    `1. Abre la App\n` +
                    `2. Pega tu ID en la casilla correspondiente\n` +
                    `3. Dale al icono de engranaje para validar\n` +
                    `4. ¡Disfruta la conexión!`;
        
        document.getElementById('clientOutput').value = msg;
    }

    function copyText(id) {
        const area = document.getElementById(id);
        if(!area.value) return;
        area.select();
        document.execCommand('copy');
        alert("Copiado al portapapeles");
    }
</script>

</body>
</html>
