<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Admin - Generador VIP Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05080f;
            --card: #111622;
            --primary: #00d2ff;
            --success: #00e676;
            --danger: #ff4d4d; /* Rojo para advertencias */
            --text: #ffffff;
            --code-bg: #080b12;
            --glow: rgba(0, 210, 255, 0.3);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            margin-bottom: 25px; 
            letter-spacing: 3px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--glow);
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; opacity: 0.7; font-weight: bold; text-transform: uppercase; }

        input {
            width: 100%;
            padding: 14px;
            background: #080b12;
            border: 1px solid #2d364a;
            border-radius: 12px;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            text-transform: uppercase;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 8px var(--glow); }

        .btn-gen {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(45deg, var(--primary), #008fb3);
            color: #05080f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            animation: pulse-cyan 2s infinite;
            margin-top: 10px;
        }

        .output-box {
            margin-top: 20px;
            background: var(--code-bg);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .github-box { border-left: 4px solid var(--primary); }
        .client-box { border-left: 4px solid var(--success); }

        .box-header { 
            font-size: 11px; 
            font-weight: 900; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .btn-copy-small {
            background: rgba(255,255,255,0.05);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ccc;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        #rawOutput { color: var(--primary); height: 40px; }
        #clientOutput { color: var(--success); height: 160px; } /* Un poco más alto por el texto nuevo */

        .history-table {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .history-table th { text-align: left; padding: 12px; color: var(--primary); }
        .history-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .status-badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--success);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid var(--success);
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h2><i class="fa-solid fa-user-shield"></i> FELIX PREMIUM</h2>
    
    <div style="display: flex; gap: 15px;">
        <div class="input-group" style="flex: 2;">
            <label>Nombre del Cliente</label>
            <input type="text" id="clientName" placeholder="EJ: FELIX254" autocomplete="off">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>Días</label>
            <input type="number" id="daysAccess" value="30">
        </div>
    </div>

    <button class="btn-gen" onclick="generateToken()">
        <i class="fa-solid fa-bolt"></i> ACTIVAR ACCESO VIP
    </button>

    <div id="outputs" style="display: none;">
        <div class="output-box github-box">
            <div class="box-header" style="color: var(--primary);">
                <span><i class="fa-brands fa-github"></i> GITHUB (PREMIUM.TXT)</span>
                <button class="btn-copy-small" onclick="copyText('rawOutput')">COPIAR</button>
            </div>
            <textarea id="rawOutput" readonly></textarea>
        </div>

        <div class="output-box client-box">
            <div class="box-header" style="color: var(--success);">
                <span><i class="fa-brands fa-whatsapp"></i> MENSAJE PARA CLIENTE</span>
                <button class="btn-copy-small" onclick="copyText('clientOutput')">COPIAR MENSAJE</button>
            </div>
            <textarea id="clientOutput" readonly></textarea>
        </div>
    </div>

    <table class="history-table">
        <thead>
            <tr>
                <th>USUARIO (MAYÚSC)</th>
                <th>PIN</th>
                <th>ESTADO</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script>
    let tokenList = [];

    function generateToken() {
        const nameInput = document.getElementById('clientName');
        const nameRaw = nameInput.value.trim() || "CLIENTE_VIP";
        const name = nameRaw.replace(/\s+/g, '_').toUpperCase();
        const days = parseInt(document.getElementById('daysAccess').value) || 30;
        const pin = Math.floor(1000 + Math.random() * 9000);

        const date = new Date();
        date.setDate(date.getDate() + days);
        const dateStr = date.toISOString().split('T')[0] + " 23:59:59";
        const dateSimple = date.toLocaleDateString();

        const data = {
            username: name,
            pin: pin,
            expiry: dateStr,
            simpleDate: dateSimple
        };

        tokenList.push(data);
        document.getElementById('outputs').style.display = 'block';
        updateUI(data);
        nameInput.value = ""; 
    }

    function updateUI(last) {
        const body = document.getElementById('historyBody');
        body.innerHTML = "";
        tokenList.slice().reverse().forEach(t => {
            body.innerHTML += `<tr>
                <td style="color:var(--primary); font-weight:bold;">${t.username}</td>
                <td style="font-family:monospace; color:var(--text);">${t.pin}</td>
                <td><span class="status-badge">ACTIVO</span></td>
            </tr>`;
        });

        document.getElementById('rawOutput').value = `${last.username},${last.expiry},${last.pin},${last.username},0`;

        // Mensaje WhatsApp con ADVERTENCIA
        const msg = `⚡ *FELIX PREMIUM VIP* ⚡\n\n` +
                    `Hola *${last.username}*, tu acceso ha sido activado con éxito.\n\n` +
                    `👤 *USUARIO:* \`${last.username}\`\n` +
                    `🔑 *PIN DE ACCESO:* \`${last.pin}\`\n` +
                    `📅 *VENCE:* ${last.simpleDate}\n\n` +
                    `⚠️ *IMPORTANTE:* No comparta su usuario con nadie más. El sistema detecta conexiones simultáneas; si lo comparte, *perderá su acceso VIP inmediatamente* sin derecho a reclamo.\n\n` +
                    `*Instrucciones:*\n` +
                    `Ingresa tu usuario y PIN en la App para conectar.\n\n` +
                    `🚀 *Gracias por preferir Felix Premium.*`;
        
        document.getElementById('clientOutput').value = msg;
    }

    function copyText(id) {
        const area = document.getElementById(id);
        if(!area.value) return;
        area.select();
        document.execCommand('copy');
        alert("¡Copiado con éxito!");
    }
</script>

</body>
</html>
