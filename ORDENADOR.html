<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Admin - Ordenador Masivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151a27;
            --primary: #00d2ff;
            --success: #00e676;
            --text: #ffffff;
            --code-bg: #080b12;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif; padding: 20px;
            display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 900px;
            background: var(--card); padding: 30px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; margin-bottom: 25px; }
        
        .panels { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .panel { flex: 1; min-width: 300px; }
        
        label { display: block; margin-bottom: 10px; font-size: 12px; font-weight: 900; color: var(--primary); }
        
        textarea {
            width: 100%; height: 350px;
            background: var(--code-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; color: #ccc; padding: 15px;
            font-family: monospace; font-size: 13px; resize: none; outline: none;
            box-sizing: border-box;
        }
        textarea:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%; padding: 20px; background: var(--primary);
            color: #0b0f19; border: none; border-radius: 15px;
            font-weight: 900; cursor: pointer; font-size: 16px;
            transition: 0.3s; margin-bottom: 20px;
            text-transform: uppercase;
        }
        .btn-main:hover { transform: scale(1.01); box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }
        
        .stats { font-size: 12px; opacity: 0.6; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-layer-group"></i> Ordenador de GitHub - Felix</h2>
    
    <div class="panels">
        <div class="panel">
            <label>1. PEGA AQUÍ TU LISTA DESORDENADA</label>
            <textarea id="inputList" placeholder="ID,FECHA,PIN,NOMBRE,LIMITE..."></textarea>
        </div>
        <div class="panel">
            <label>2. LISTA ORDENADA (A-Z)</label>
            <textarea id="outputList" readonly placeholder="El resultado aparecerá aquí..."></textarea>
        </div>
    </div>

    <button class="btn-main" onclick="procesarLista()">
        <i class="fa-solid fa-arrow-down-a-z"></i> Organizar por Nombre ahora
    </button>
    
    <div class="stats" id="contador">Clientes detectados: 0</div>
</div>

<script>
    function procesarLista() {
        const input = document.getElementById('inputList').value.trim();
        if (!input) return alert("Pega algo primero, Felix.");

        // Convertimos el texto en un array de líneas
        let lineas = input.split('\n');
        
        // Filtramos líneas vacías y procesamos el ordenado
        let listaProcesada = lineas
            .filter(linea => linea.trim() !== "") // Quitar líneas en blanco
            .map(linea => {
                let partes = linea.split(',');
                return {
                    original: linea.trim(),
                    nombre: partes[3] ? partes[3].trim().toLowerCase() : "zzzz" // Usamos el nombre (posición 3) para ordenar
                };
            });

        // Ordenar de la A a la Z usando el nombre
        listaProcesada.sort((a, b) => a.nombre.localeCompare(b.nombre));

        // Reconstruir el texto final
        let resultado = listaProcesada.map(obj => obj.original).join('\n');

        document.getElementById('outputList').value = resultado;
        document.getElementById('contador').innerText = `Clientes detectados: ${listaProcesada.length}`;
        
        // Efecto visual de copiado automático al terminar
        const output = document.getElementById('outputList');
        output.select();
        document.execCommand('copy');
        alert("¡Listo! Lista ordenada y copiada al portapapeles.");
    }
</script>

</body>
</html>
